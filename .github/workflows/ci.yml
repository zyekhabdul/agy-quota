name: CI & Packaging

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build cryptography rich
      - name: Test script syntax & help
        run: |
          python -m py_compile bin/agy-quota
          python bin/agy-quota --help
      - name: Build Python packages (Wheel & Sdist)
        run: python -m build
      - name: Build Debian Package
        run: bash packaging/debian/build-deb.sh
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-packages-${{ matrix.python-version }}
          path: |
            dist/*
            packaging/debian/*.deb
